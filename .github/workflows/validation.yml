name: MindPal Validation

on:
  push:
    paths:
      - 'backend/**'
      - 'data/prompt_fixtures/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'frontend/src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/validate_runtime_configs.py'
      - 'scripts/evaluate_prompt_contracts.py'
      - 'scripts/validate_supabase_migrations.py'
      - 'pyproject.toml'
      - 'requirements.lock'
      - '.github/workflows/validation.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'data/prompt_fixtures/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'frontend/src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/validate_runtime_configs.py'
      - 'scripts/evaluate_prompt_contracts.py'
      - 'scripts/validate_supabase_migrations.py'
      - 'pyproject.toml'
      - 'requirements.lock'
      - '.github/workflows/validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      MINDPAL_STORAGE_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.lock pytest pytest-asyncio bandit pip-audit
      - name: Validate runtime JSON schemas
        run: python scripts/validate_runtime_configs.py
      - name: Evaluate prompt contracts
        run: python scripts/evaluate_prompt_contracts.py
      - name: Validate Supabase migrations
        run: python scripts/validate_supabase_migrations.py
      - name: Run backend tests
        run: pytest tests -q
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Bandit security scan
        # Medium severity and above fails the build; low findings are reviewed in PRs.
        run: bandit --quiet --severity-level medium --recursive backend --exclude backend/**/__pycache__
      - name: Dependency vulnerability scan
        run: pip-audit --requirement requirements.lock
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install the browser for end-to-end and audio worklet tests
        run: npx playwright install --with-deps chromium
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build CSS and bundle (the end-to-end tests load the built app)
        run: npm run build:css && npm run build:app
      - name: Frontend and voice contract tests
        run: npm test
