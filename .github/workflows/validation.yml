name: MindPal Validation

on:
  push:
    paths:
      - 'backend/**'
      - 'data/prompt_fixtures/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'contracts/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'requirements-dev.lock'
      - '.github/workflows/validation.yml'
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.env.example'
      - 'tailwind.config.cjs'
      - 'data/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'backend/**'
      - 'data/prompt_fixtures/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'contracts/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'requirements-dev.lock'
      - '.github/workflows/validation.yml'
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.env.example'
      - 'tailwind.config.cjs'
      - 'data/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      MINDPAL_STORAGE_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the pull request's commit range, which needs history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.lock bandit pip-audit
      - name: Validate runtime JSON schemas
        run: python scripts/ci/validate_runtime_configs.py
      - name: Evaluate prompt contracts
        run: python scripts/ci/evaluate_prompt_contracts.py
      - name: Validate Supabase migrations
        run: python scripts/ci/validate_supabase_migrations.py
      - name: Architecture boundaries and contract drift
        run: python scripts/ci/check_architecture.py
      - name: Source syntax and integrity
        run: python scripts/ci/audit_syntax_integrity.py
      - name: Run backend tests
        run: pytest -q
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Bandit security scan
        # Medium severity and above fails the build; low findings are reviewed in PRs.
        run: bandit --quiet --severity-level medium --recursive backend
      - name: Dependency vulnerability scan
        run: pip-audit --requirement requirements.lock
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install browsers for end-to-end, device (iPhone WebKit / Android Chromium) and audio worklet tests
        run: npx playwright install --with-deps chromium webkit
      - name: Generated brand files match brand.json
        # `npm run build` regenerates index.html's head from brand.json; a stale
        # commit there is silently rewritten on the next local build.
        run: python3 scripts/build/apply_brand.py --check
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build CSS and bundle (the end-to-end tests load the built app)
        run: npm run build:css && npm run build:app
      - name: Frontend security and build audit
        run: python3 scripts/ci/audit_frontend.py
      - name: Frontend and voice contract tests
        run: npm test
