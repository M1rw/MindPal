    <!-- Header / Navbar -->
    <header class="flex items-center justify-between px-5 pt-safe-top pb-3 transition-all duration-300 flex-none z-10 bg-transparent absolute top-0 w-full" id="header">
        <div class="flex items-center gap-2">
            <span class="text-xl font-medium tracking-tight text-gray-800 dark:text-gray-200">MindPal</span>
            <div id="env-tag" class="px-2 py-0.5 rounded-md bg-gemini-surface dark:bg-gemini-darkSurface text-[10px] font-medium text-gray-500 dark:text-gray-400 transition-colors">Local</div>
        </div>

        <div class="flex items-center gap-1 sm:gap-2 text-gray-600 dark:text-gray-300">
            <button id="theme-toggle-btn" class="p-2 hover:bg-gemini-surface dark:hover:bg-gemini-darkSurface rounded-full transition-colors flex-shrink-0 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none" title="Toggle Theme" aria-label="Toggle theme">
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>

            <button id="streak-btn" class="flex items-center gap-1.5 px-3 py-1.5 hover:bg-gemini-surface dark:hover:bg-gemini-darkSurface rounded-full transition-colors text-[14px] font-medium focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none" title="View Progress" aria-label="View daily streak progress">
                <span id="streak-counter">0</span>
                <i data-lucide="flame" class="w-4 h-4 text-orange-500 dark:text-orange-400"></i>
            </button>

            <button id="profile-btn" class="p-1.5 hover:bg-gemini-surface dark:hover:bg-gemini-darkSurface rounded-full transition-colors flex-shrink-0 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none" title="Profile & Settings" aria-label="Profile and settings">
                <div class="w-8 h-8 rounded-full bg-gray-200 dark:bg-zinc-700 flex items-center justify-center text-gray-600 dark:text-gray-300 border border-gray-300 dark:border-zinc-600" id="profile-avatar">
                    <i data-lucide="user" class="w-4 h-4"></i>
                </div>
            </button>
        </div>
    </header>
