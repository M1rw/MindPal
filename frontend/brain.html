<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#131314">
  <meta name="description" content="MindPal Memory — a private view of the context that helps MindPal stay continuous.">
  <title>Brain · MindPal</title>
  <script src="./runtime-config.js"></script>
  <link rel="stylesheet" href="./css/tailwind.generated.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/brain.css">
  <script defer src="./dist/lucide.bundle.js"></script>
  <script type="module" src="./dist/brain.bundle.js"></script>
</head>
<body class="brain-page-body bg-gemini-bg dark:bg-gemini-darkBg text-gemini-text dark:text-gemini-darkText font-sans antialiased">
  <header class="brain-site-header">
    <a class="brain-brand" href="/" aria-label="Return to MindPal chat">MindPal</a>
    <div class="brain-site-actions">
      <span id="brain-account-label" class="brain-account-label">Local memory</span>
      <button id="brain-theme-toggle" class="brain-page-icon-button" type="button" title="Toggle theme" aria-label="Toggle theme">
        <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      </button>
      <a class="brain-return-link" href="/">Back to chat</a>
    </div>
  </header>

  <main id="brain-workspace" class="brain-workspace brain-standalone-workspace" aria-label="MindPal Memory">
    <div class="brain-shell">
      <header class="brain-page-header">
        <div class="brain-page-title">
          <div><h1>Brain</h1><p id="brain-status-copy" aria-live="polite">Your private memory graph, moving in real time.</p></div>
        </div>
        <div class="brain-toolbar">
          <span class="brain-sync-label"><span id="brain-mode-label">LOCAL</span> · <b id="brain-version">v1</b></span>
          <button id="brain-list-toggle" class="brain-toolbar-button" type="button"><i data-lucide="list-tree" class="w-4 h-4"></i><span>List</span></button>
          <button id="brain-refresh-btn" class="brain-icon-button" type="button" title="Refresh memory"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
        </div>
      </header>
      <nav class="brain-view-nav" aria-label="Brain navigation">
        <button class="brain-view-button active" type="button" data-brain-view="map"><i data-lucide="network" class="w-4 h-4"></i><span>Graph</span></button>
        <button class="brain-view-button" type="button" data-brain-view="review"><i data-lucide="badge-alert" class="w-4 h-4"></i><span>Review</span><b id="brain-review-count">0</b></button>
      </nav>
      <div class="brain-controls">
        <label class="brain-search"><i data-lucide="search" class="w-4 h-4"></i><input id="brain-search-input" type="search" autocomplete="off" placeholder="Search saved memories" aria-label="Search saved memories"></label>
        <div id="brain-category-filters" class="brain-filter-stack" aria-label="Filter memory categories"></div>
      </div>
      <div class="brain-layout">
        <section class="brain-canvas-pane">
          <div id="brain-main-content" class="brain-main-content" aria-live="polite"></div>
          <div id="brain-list-equivalent" class="brain-list-equivalent" hidden aria-label="Accessible memory list"></div>
        </section>
        <aside id="brain-inspector" class="brain-inspector" aria-label="Memory details">
          <div class="brain-inspector-empty"><i data-lucide="scan-eye" class="w-6 h-6"></i><p>Select a memory to see its details and connections.</p></div>
        </aside>
      </div>
    </div>
  </main>
  <div id="brain-toast" class="brain-toast" role="status" aria-live="polite"></div>
</body>
</html>
