<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Resource hints for critical render path -->
    <link rel="preload" href="./css/tailwind.generated.css" as="style">
    <link rel="preload" href="./css/style.css" as="style">
    <!-- Preload Google Identity Services before any user-initiated cloud sign-in. -->
    <script defer src="https://accounts.google.com/gsi/client" data-mindpal-google-identity></script>
    <link rel="stylesheet" href="./css/tailwind.generated.css">
    <link rel="stylesheet" href="./css/style.css" id="main-css">

    <!-- MindPal SEO / Social / PWA -->
    <title>MindPal — AI support that remembers what matters</title>
    <meta name="description" content="MindPal is a private AI companion for reflection, emotional clarity, voice journaling, memory, and practical support.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://mindpal-demo.vercel.app/">

    <meta name="application-name" content="MindPal">
    <meta name="apple-mobile-web-app-title" content="MindPal">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <meta name="theme-color" content="#EFF3FB" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1E1E2E" media="(prefers-color-scheme: dark)">

    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/brand/icon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MindPal">
    <meta property="og:title" content="MindPal — AI support that remembers what matters">
    <meta property="og:description" content="MindPal is a private AI companion for reflection, emotional clarity, voice journaling, memory, and practical support.">
    <meta property="og:url" content="https://mindpal-demo.vercel.app/">
    <meta property="og:image" content="https://mindpal-demo.vercel.app/assets/brand/og-image.png">
    <meta property="og:image:secure_url" content="https://mindpal-demo.vercel.app/assets/brand/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="MindPal — AI support that remembers what matters">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MindPal — AI support that remembers what matters">
    <meta name="twitter:description" content="MindPal is a private AI companion for reflection, emotional clarity, voice journaling, memory, and practical support.">
    <meta name="twitter:image" content="https://mindpal-demo.vercel.app/assets/brand/og-image.png">
    <meta name="twitter:image:alt" content="MindPal — AI support that remembers what matters">
    <!-- /MindPal SEO / Social / PWA -->

    <!-- Vercel Web Analytics & Speed Insights (Loaded only when running on Vercel production) -->
    <script>
      if (window.location.hostname.endsWith(".vercel.app")) {
        const insightsScript = document.createElement("script");
        insightsScript.defer = true;
        insightsScript.src = "/_vercel/insights/script.js";
        document.head.appendChild(insightsScript);

        const speedScript = document.createElement("script");
        speedScript.defer = true;
        speedScript.src = "/_vercel/speed-insights/script.js";
        document.head.appendChild(speedScript);
      }
    </script>

    <!-- MindPal Enterprise Document Bootstrap (Populated dynamically on GET /) -->
    <script id="__MINDPAL_BOOTSTRAP__" type="application/json">{}</script>
</head>

<body class="bg-gemini-bg dark:bg-gemini-darkBg text-gemini-text dark:text-gemini-darkText h-dvh-safe flex flex-col font-sans overflow-hidden antialiased transition-colors duration-300">

    <!-- React App Root — MindPal UI is rendered here by src/main.tsx -->
    <div id="root"></div>

    <!-- React application bundle -->
    <script type="module" src="./dist/app.bundle.js"></script>
</body>
</html>
