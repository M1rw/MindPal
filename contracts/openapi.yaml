openapi: 3.1.0
info:
  title: MindPal API
  version: 5.0.0
  description: >
    Source of truth for HTTP. FastAPI may only expose operations listed here.
    Brain (Obsidian workspace HTTP) is retired; memory graph is the durable store.

x-mindpal-catalog:
  ai-access-values: [hidden, catalog, schema, invoke]
  audience-values: [public, user, admin, system]
  retired:
    - /api/brain/*

paths:
  /api/internal/memory-consolidation:
    get:
      operationId: opsMemoryConsolidation
      tags: [internal]
      summary: Scheduled, load-aware memory consolidation (digests and AI summaries)
      x-mindpal:
        owner: memory
        status: preview
        audience: system
        ai-access: hidden
        client: scheduler
        sunset: null
        side-effects: true
      responses:
        "200": { description: Consolidation report }
        "401": { description: Scheduler credential required }

  /api/internal/platform-pulse:
    get:
      operationId: opsPlatformPulse
      tags: [internal]
      summary: Current load level, its drivers, and the aggregated platform pulse
      x-mindpal:
        owner: platform
        status: preview
        audience: system
        ai-access: hidden
        client: support
        sunset: null
        side-effects: false
      responses:
        "200": { description: Load state }
        "401": { description: Support credential required }

  /api/internal/voice-retention:
    get:
      operationId: voiceRetentionSweep
      tags: [internal]
      summary: Scheduled voice retention sweep
      x-mindpal:
        owner: voice
        status: live
        audience: system
        ai-access: hidden
        client: scheduler
        sunset: null
        side-effects: true
      responses:
        "200": { description: Retention counts }
        "401": { description: Scheduler credential required }

  /api/internal/voice-diagnostics:
    post:
      operationId: voiceSubmitDiagnostics
      tags: [internal]
      summary: Internal redacted voice diagnostics ingestion
      x-mindpal:
        owner: voice
        status: live
        audience: system
        ai-access: hidden
        client: support
        sunset: null
        side-effects: true
      responses:
        "200": { description: Stored diagnostics }
        "401": { description: Internal support authorization required }

  /api/internal/voice-diagnostics/{session_id}:
    get:
      operationId: voiceReviewDiagnostics
      tags: [internal]
      summary: Internal redacted voice diagnostics review
      x-mindpal:
        owner: voice
        status: live
        audience: system
        ai-access: hidden
        client: support
        sunset: null
        side-effects: false
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { description: Redacted diagnostic records }
        "401": { description: Internal support authorization required }

  /api/health:
    get:
      operationId: healthLive
      tags: [health]
      summary: Process liveness
      x-mindpal:
        owner: system
        status: live
        audience: public
        ai-access: invoke
        client: web
        sunset: null
        side-effects: false
      responses:
        "200":
          description: Process is up

  /api/health/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Dependency readiness
      x-mindpal:
        owner: system
        status: live
        audience: public
        ai-access: catalog
        client: web
        sunset: null
        side-effects: false
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready

  /api/release/changelog:
    get:
      operationId: releaseChangelogGet
      tags: [release]
      summary: Product changelog (verbatim contracts/changelog.json)
      x-mindpal:
        owner: release
        status: live
        audience: public
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200":
          description: Changelog document
    post:
      operationId: releaseChangelogDismiss
      tags: [release]
      summary: Dismiss a changelog version for the current user
      x-mindpal:
        owner: release
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
      responses:
        "204": { description: Dismissed }
        "401": { description: Sign in required }

  /api/chat/stream:
    post:
      operationId: chatStream
      tags: [chat]
      summary: Guarded chat SSE of already-safe text
      x-mindpal:
        owner: chat
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: text/event-stream }
        "401": { description: Sign in required }

  /api/chats/current:
    get:
      operationId: sessionsGetCurrent
      tags: [sessions]
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Chat document }
        "401": { description: Sign in required }
    put:
      operationId: sessionsReplaceCurrent
      tags: [sessions]
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Saved }
        "401": { description: Sign in required }
    delete:
      operationId: sessionsDeleteCurrent
      tags: [sessions]
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Deleted }
        "401": { description: Sign in required }

  /api/chats/current/messages:
    post:
      operationId: sessionsAppendMessages
      tags: [sessions]
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Appended }
        "401": { description: Sign in required }

  /api/chats:
    get:
      operationId: chatsList
      tags: [sessions]
      summary: List all persistent chat sessions
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: List of chat sessions }
        "401": { description: Sign in required }
    post:
      operationId: chatsSave
      tags: [sessions]
      summary: Save persistent chat session
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Saved session }
        "401": { description: Sign in required }

  /api/chats/{session_id}:
    get:
      operationId: chatsGet
      tags: [sessions]
      summary: One chat saved to the caller's own account. 404 when it is not theirs.
      summary: Get chat session by ID
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Chat session }
        "401": { description: Sign in required }
    delete:
      operationId: chatsDelete
      tags: [sessions]
      summary: Delete chat session by ID
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Deleted }
        "401": { description: Sign in required }

  /api/sessions/telemetry:
    post:
      operationId: sessionsRecordTelemetry
      tags: [sessions]
      summary: Ingest client interaction telemetry
      x-mindpal:
        owner: sessions
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Recorded }
        "401": { description: Sign in required }

  /api/greeting:
    get:
      operationId: greetingGet
      tags: [greeting]
      summary: Personalized time-of-day greeting with memory context
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Personalized greeting }
        "401": { description: Sign in required }

  /api/user/me:
    get:
      operationId: identityMe
      tags: [identity]
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Session view }

  /api/user/profile:
    get:
      operationId: identityGetProfile
      tags: [identity]
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Profile }
        "401": { description: Sign in required }
    patch:
      operationId: identityPatchProfile
      tags: [identity]
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Profile }
        "401": { description: Sign in required }

  /api/user/insights:
    get:
      operationId: identityGetInsights
      tags: [identity]
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Insights }
        "401": { description: Sign in required }

  /api/user/adaptation:
    get:
      operationId: identityGetAdaptation
      tags: [identity]
      summary: What MindPal has learned about how to talk with this person
      description: >
        Confident style preferences (length, approach, tone, lists, emoji,
        language) and per-strategy feedback scores learned from the account's
        own conversations. Style only; safety behavior is never learned.
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Adaptive profile summary }
        "401": { description: Sign in required }
    delete:
      operationId: identityResetAdaptation
      tags: [identity]
      summary: Forget everything MindPal has learned about this person's preferences
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Adaptive profile reset }
        "401": { description: Sign in required }

  /api/chat/feedback:
    post:
      operationId: chatReplyFeedback
      tags: [chat]
      summary: Thumbs up or down on a reply
      description: >
        Rewards or penalizes the conversational strategy that produced the reply
        (the reply's strategy_used, or the account's most recent one).
      x-mindpal:
        owner: chat
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [up, down] }
                strategy: { type: string, maxLength: 40 }
      responses:
        "200": { description: Feedback recorded }
        "401": { description: Sign in required }
        "422": { description: Invalid rating }

  /api/user/wellness-timeline:
    get:
      operationId: identityGetWellnessTimeline
      tags: [identity]
      summary: Mood, themes, and life events from saved memory and synced chats
      description: >
        Authenticated reflection of the signed-in account's saved memory atoms and
        synced user turns. Coarse valence labels (heavier / mixed / lighter) are
        derived from the person's words. This is not PHQ-9, GAD-7, or a clinical
        score. Delete `/api/user/data` removes the source data. Guests receive 401.
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Wellness timeline derived from stored memory and chats }
        "401": { description: Sign-in required }

  /api/user/export:
    get:
      operationId: identityExport
      tags: [identity]
      summary: Download signed-in account data
      description: >
        Authenticated JSON of server-stored profile, memory graph, and synced
        chat sessions. Does not include this browser's local history or guest facts.
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: JSON export of profile, memory, and synced chats }
        "401": { description: Sign-in required }

  /api/user/data:
    delete:
      operationId: identityDeleteData
      tags: [identity]
      summary: Delete signed-in account data
      description: >
        Permanently deletes the server profile, memory graph, and synced chats
        for the signed-in account. Local browser chat history is not removed.
      x-mindpal:
        owner: identity
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Deleted server profile, memory, and synced chats }
        "401": { description: Sign-in required }

  /api/memory/graph:
    get:
      operationId: memoryGetGraph
      tags: [memory]
      summary: Canonical durable memory graph
      x-mindpal:
        owner: memory
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Graph }
    put:
      operationId: memoryPutGraph
      tags: [memory]
      x-mindpal:
        owner: memory
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Graph }
        "401": { description: Sign in required }

  /api/memory/graph/items/{atom_id}:
    patch:
      operationId: memoryPatchGraphItem
      tags: [memory]
      summary: Update stored text for one memory atom
      x-mindpal:
        owner: memory
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Graph after update }
        "401": { description: Sign-in required }
        "404": { description: Atom not saved }
        "422": { description: Empty memory text }
    delete:
      operationId: memoryDeleteGraphItem
      tags: [memory]
      x-mindpal:
        owner: memory
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Graph after delete }
        "401": { description: Sign in required }

  /api/memory/summary:
    get:
      operationId: memoryGetSummary
      tags: [memory]
      x-mindpal:
        owner: memory
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Summary }

  /api/memory/journal:
    get:
      operationId: memoryGetJournal
      tags: [memory]
      summary: The AI summary, the conversation digests behind it, and queued work
      x-mindpal:
        owner: memory
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Memory journal view }
        "401": { description: Sign in required }

  /api/memory/narrative:
    delete:
      operationId: memoryForgetNarrative
      tags: [memory]
      summary: Delete the AI summary, its digests, and journaled turns (saved facts stay)
      x-mindpal:
        owner: memory
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Forgotten }
        "401": { description: Sign in required }

  /api/memory/summary/refresh:
    post:
      operationId: memoryRefreshSummary
      tags: [memory]
      summary: >-
        With {"summary": "..."} store a summary the person wrote. With no body,
        rebuild the AI summary from conversation digests and saved facts now if
        the person's daily AI budget and platform load allow, otherwise queue it
        (response `status`: updated, queued, or unchanged).
      x-mindpal:
        owner: memory
        status: preview
        audience: user
        ai-access: schema
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Summary }
        "401": { description: Sign in required }

  /api/usage:
    get:
      operationId: usageGetSnapshot
      tags: [usage]
      summary: Current chat credit windows without spending a credit; per network when signed out
      x-mindpal:
        owner: chat
        status: live
        audience: public
        ai-access: hidden
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: "{chat: {credits_5h, limit_5h, reset_5h_seconds, credits_week, limit_week, reset_week_seconds, scope}}" }
        "503": { description: Storage unavailable }

  /api/voice/usage:
    get:
      operationId: voiceGetUsage
      tags: [voice]
      summary: Today's live-voice budget for the signed-in user; read-only and never reserves
      x-mindpal:
        owner: voice
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Used, remaining and cap seconds for the current UTC day }
        "401": { description: Sign in required }

  /api/voice/analytics:
    get:
      operationId: voiceGetSessionAnalytics
      tags: [voice]
      summary: Owner-scoped structured analytics for an active or finished live call
      x-mindpal:
        owner: voice
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: false
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { description: Session analytics }
        "401": { description: Sign in required }

  /api/voice/audit:
    get:
      operationId: voiceGetSessionAudit
      tags: [voice]
      summary: Owner-scoped safety and telemetry audit for a live call
      x-mindpal:
        owner: voice
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: false
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { description: Session audit }
        "401": { description: Sign in required }

  /api/voice/session-token:
    post:
      operationId: voiceCreateSessionToken
      tags: [voice]
      summary: Mint a Gemini Live ephemeral token for a signed-in user; a second mint for the same user reclaims any prior active session
      x-mindpal:
        owner: voice
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Constrained Gemini Live token }
        "401": { description: Sign in required }
        "403": { description: Live voice flag off }
        "429": { description: Voice minutes exhausted }
        "503": { description: Provider not configured or mint failed }

  /api/voice/session-events:
    post:
      operationId: voiceRecordSessionEvent
      tags: [voice]
      summary: Record live floor events and safety partials; teardown may omit session_id to hang up the account's one active call
      x-mindpal:
        owner: voice
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Policy action }
        "401": { description: Sign in required }
        "404": { description: Unknown session }

  /api/voice/trace:
    post:
      operationId: voiceSubmitTrace
      tags: [voice]
      summary: Upload a redacted client trace for the caller's own voice session
      x-mindpal:
        owner: voice
        status: live
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Trace correlation receipt }
        "401": { description: Sign in required }
        "404": { description: Unknown session }

  /api/voice/reaction:
    post:
      operationId: voiceClassifyReaction
      tags: [voice]
      summary: Pick the face's silent listening reaction to a phrase, in any language
      x-mindpal:
        owner: voice
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: "One of smile, laugh, surprise, concern, tender, excited, curious, none (none when rate limited or unavailable)" }
        "401": { description: Sign in required }
        "403": { description: Live voice flag off }

  /api/voice/recall:
    post:
      operationId: voiceRecall
      tags: [voice]
      summary: Answer the live model's memory or past-chat lookup for the caller's own call
      x-mindpal:
        owner: voice
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: "Short plain-text result and whether anything was found" }
        "401": { description: Sign in required }
        "403": { description: Live voice flag off }
        "404": { description: Not this caller's call, or the call has ended }

  /api/voice/summarize:
    post:
      operationId: voiceSummarizeSession
      tags: [voice]
      summary: Recap a finished live call into the user's chat history
      x-mindpal:
        owner: voice
        status: preview
        audience: user
        ai-access: hidden
        client: web
        sunset: null
        side-effects: true
      responses:
        "200": { description: Chat receipt or an honest skip }
        "401": { description: Sign in required }
        "404": { description: Unknown session }

  /api/features:
    get:
      operationId: flagsSnapshot
      tags: [flags]
      x-mindpal:
        owner: flags
        status: preview
        audience: public
        ai-access: schema
        client: web
        sunset: null
        side-effects: false
      responses:
        "200": { description: Feature snapshot }

  /api/system/route-catalog:
    get:
      operationId: systemRouteCatalog
      tags: [system]
      summary: >-
        Full API surface including operations that are not yet live. Signed-in
        only: it names every route and says which of them mutate state.
      summary: OpenAPI operations filtered by caller ai-access
      x-mindpal:
        owner: system
        status: preview
        audience: admin
        ai-access: hidden
        client: none
        sunset: null
        side-effects: false
      responses:
        "200": { description: Filtered catalog }
        "401": { description: Sign in required }
        "403": { description: Admin only }
