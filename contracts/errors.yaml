# Stable API error codes. HTTP adapters map AppError.code → status + client_action.

codes:
  unauthenticated:
    status: 401
    client_action: sign_in
  forbidden:
    status: 403
    client_action: hide
  not_found:
    status: 404
    client_action: hide
  conflict:
    status: 409
    client_action: reload
  payload_invalid:
    status: 422
    client_action: fix_input
  quota_exceeded:
    status: 429
    client_action: wait
  rate_limited:
    status: 429
    client_action: wait
  unavailable:
    status: 503
    client_action: retry
  internal:
    status: 500
    client_action: retry
  safety_blocked:
    status: 200
    client_action: show_deterministic
    notes: Crisis paths still return 200 with a deterministic body, not a 4xx.
